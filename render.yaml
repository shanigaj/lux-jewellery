# Render Blueprint — backend API for Sparenza & Co.
# In Render: New → Blueprint → connect this repo. Secrets (sync:false)
# are entered in the dashboard, not committed here.
services:
  - type: web
    name: sparenza-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Comma-separated allowed origins (prod domain, www, Vercel URL).
      # e.g. https://sparenza.com,https://www.sparenza.com,https://sparenza.vercel.app
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      # Email is sent via Resend's HTTPS API (Render blocks outbound SMTP).
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      # SMTP kept as a local-dev fallback; unused in prod when RESEND_API_KEY is set.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
